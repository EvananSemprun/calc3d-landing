<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producto — Banano Lab</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<!--
  Ficha de producto. La estructura viene del diseño de Lovable (migas, galería,
  selectores de variante, especificaciones y relacionados), que es lo que le
  faltaba al de Claude Design.

  La URL es /producto/{slug}: nginx sirve este archivo para todo lo que cuelgue
  de /producto/ y el slug se lee del path. Sin eso, cada producto necesitaría su
  propio HTML generado en el build.
-->
<!--#include header-->

<div class="container">
  <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
</div>

<main class="container" id="pdp">
  <div class="shop-state"><strong>Cargando…</strong></div>
</main>

<section class="section" style="padding-top:clamp(40px,5vw,64px)" id="relacionadosWrap" hidden>
  <div class="container">
    <div class="eyebrow-row" style="margin-bottom:24px">
      <h2 class="h2">También te puede servir</h2>
      <a href="/tienda/" class="btn btn-ghost btn-sm">Ver todo el catálogo</a>
    </div>
    <div class="grid shop-grid" id="relacionados"></div>
  </div>
</section>

<!--#include footer-->

<script type="module" src="/assets/app.js"></script>
<script type="module">
import { renderFichaHtml, precioConTramos } from '/assets/render.js';

const Pdp = {
  producto: null,
  /** Opción elegida por grupo: { "Color": "Rojo" }. */
  elegido: {},
  cantidad: 1,
  fotoActiva: 0,

  slug() {
    // /producto/llavero-personalizado → "llavero-personalizado"
    return decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() ?? '');
  },

  async init() {
    const slug = this.slug();
    if (!slug || slug === 'producto') return this.fallo('Falta el producto en la dirección.');
    try {
      await BL.load();
      this.producto = await fetchProduct(slug);
    } catch (e) {
      console.error(e);
      // Si la página vino PRE-RENDERIZADA (SSG), el contenido ya está en el HTML:
      // se deja en vez de reemplazarlo por un error. Perdemos lo interactivo
      // (el fetch falló), pero el visitante igual ve y lee la ficha — que es
      // justo el valor del pre-render. Sin pre-render, mostramos el error.
      if (document.querySelector('#pdp .pdp')) return;
      return this.fallo('No encontramos este producto. Puede que ya no esté publicado.');
    }
    this.cantidad = this.producto.minQty || 1;
    // Las opciones obligatorias arrancan con la primera elegida: obliga menos y
    // el precio mostrado siempre corresponde a algo pedible.
    for (const g of this.producto.optionGroups ?? []) {
      if (g.required && g.options.length) this.elegido[g.name] = g.options[0].value;
    }
    this.chrome();
    this.render();
    this.relacionados();
  },

  fallo(msg) {
    document.getElementById('pdp').innerHTML =
      `<div class="shop-state"><strong>${esc(msg)}</strong>
       <a class="btn btn-primary btn-sm" style="margin-top:14px" href="/tienda/">Volver a la tienda</a></div>`;
  },

  chrome() {
    const p = this.producto;
    document.title = `${p.name} — ${BL.info.businessName}`;
    blPintarNegocio();

    // El "cotizar" de esta pagina habla del producto que se esta mirando, asi
    // que pisa el mensaje generico que dejo blPintarNegocio().
    const tel = blTelefono(BL.info.whatsappPhone);
    if (tel) {
      const msg = encodeURIComponent(`Hola ${BL.info.businessName}, quiero consultar por "${p.name}".`);
      document.querySelectorAll('[data-bl="cotizar"]').forEach((a) => {
        a.href = `https://wa.me/${tel}?text=${msg}`;
      });
    }

    document.getElementById('crumbs').innerHTML =
      '<a href="/tienda/">Tienda</a><span>/</span>' +
      (p.catLabel ? `<a href="/tienda/?cat=${encodeURIComponent(p.cat)}">${esc(p.catLabel)}</a><span>/</span>` : '') +
      `<span class="dim">${esc(p.name)}</span>`;
  },

  /** Precio con los recargos de las opciones, SIN el tramo por cantidad. Es lo
   *  que se guarda en el carrito; el tramo se recalcula ahí según la cantidad. */
  precioBase() {
    let total = this.producto.price;
    for (const g of this.producto.optionGroups ?? []) {
      const op = g.options.find((o) => o.value === this.elegido[g.name]);
      if (op) total += op.priceDeltaUsd || 0;
    }
    return total;
  },
  /** Precio unitario mostrado: base + recargos + tramo de la cantidad actual. */
  precio() {
    return precioConTramos(this.precioBase(), this.cantidad, this.producto.priceTiers);
  },

  render() {
    // El markup vive en renderFichaHtml (render.js), compartido con el build para
    // que el pre-render y este render no diverjan. Acá solo se pasa el estado.
    document.getElementById('pdp').innerHTML = renderFichaHtml(this.producto, {
      elegido: this.elegido,
      cantidad: this.cantidad,
      fotoActiva: this.fotoActiva,
      rate: BL.info.rate,
    });

    // Eventos (delegados a mano: el HTML se regenera en cada cambio).
    document.querySelectorAll('.pdp-thumb').forEach((t) =>
      t.addEventListener('click', () => { this.fotoActiva = +t.dataset.foto; this.render(); }));
    document.querySelectorAll('.pdp-opts').forEach((cont) =>
      cont.querySelectorAll('.pdp-opt').forEach((b) =>
        b.addEventListener('click', () => {
          this.elegido[cont.dataset.grupo] = b.dataset.opt;
          // Si cambió el color del grupo que define la foto, la galería cambia:
          // volver a la primera foto para no quedar en una miniatura inexistente.
          const grupoFoto = (this.producto.optionGroups || []).find((g) => g.drivesPhoto);
          if (grupoFoto && grupoFoto.name === cont.dataset.grupo) this.fotoActiva = 0;
          this.render();
        })));
    document.querySelectorAll('[data-cant]').forEach((b) =>
      b.addEventListener('click', () => {
        const min = this.producto.minQty || 1;
        this.cantidad = Math.max(min, this.cantidad + Number(b.dataset.cant));
        // Re-render para que el precio unitario refleje el tramo de la cantidad.
        this.render();
      }));
    document.getElementById('agregar')?.addEventListener('click', () => {
      // Van las opciones elegidas: son las que definen el precio del renglón.
      // Se guarda el unitario SIN tramo; el carrito aplica el tramo por cantidad.
      Cart.add(this.producto.id, this.cantidad, this.elegido, this.precioBase());
    });
  },

  /** Otros productos de la misma categoría (o cualquiera, si no hay). */
  /** Otros productos de la misma categoria (o cualquiera, si no hay). */
  relacionados() {
    const p = this.producto;
    let otros = BL.products.filter((x) => x.id !== p.id && p.cat && x.cat === p.cat);
    if (otros.length === 0) otros = BL.products.filter((x) => x.id !== p.id);
    if (!otros.length) return;
    document.getElementById('relacionadosWrap').hidden = false;
    const grid = document.getElementById('relacionados');
    grid.innerHTML = otros.slice(0, 3).map(blTarjetaProducto).join('');
    blEngancharTarjetas(grid);
  },
};

window.Pdp = Pdp;
window.addEventListener('DOMContentLoaded', () => Pdp.init());
</script>
</body>
</html>
