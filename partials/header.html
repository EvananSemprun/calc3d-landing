<!--
  Cabecera ÚNICA del sitio. La inyecta el plugin `parciales()` de vite.config.ts
  donde cada página pone su marca de inclusión, en desarrollo y en el build.

  OJO: no escribir esa marca literal dentro de un comentario — un comentario
  anidado dentro de otro rompe el parser de HTML de Vite (el build falla con un
  error de tokenizer que no menciona el parcial, así que cuesta encontrarlo).

  Está en HTML y no en JavaScript a propósito: los enlaces internos son como un
  buscador descubre las otras páginas. Pintarlos con JS dejaría cada página
  aislada, que es justo el problema de SEO que ya arrastra el catálogo.

  El item activo lo marca `blMarcarNav()` en app.js comparando con la ruta.
-->
