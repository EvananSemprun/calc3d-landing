# nginx para servir el sitio ESTÁTICO de Astro (`dist/`) en el contenedor. Astro genera
# un archivo HTML por ruta (/producto/slug/index.html), así que no hay SPA fallback: una
# ruta inexistente da 404 REAL con la página de marca (404.html), no un "404 blando".
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad básicas.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Assets con hash de Astro: cache agresivo e inmutable.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Páginas: el archivo exacto o su carpeta; si no existe, 404 real.
  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
