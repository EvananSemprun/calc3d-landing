server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad. La tienda no guarda sesión, pero igual: sin sniffing,
  # sin embebido en iframes ajenos y sin filtrar el referer a terceros.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Los assets llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # /producto/{slug} lo atiende siempre el mismo HTML; el slug se lee del path.
  location /producto/ {
    try_files $uri $uri/ /producto/index.html;
  }

  # Cada pagina del sitio existe como carpeta con su index.html, asi que $uri/
  # las resuelve todas. El respaldo es 404 y NO el inicio: devolver el inicio con
  # codigo 200 ante cualquier direccion equivocada es un "404 blando", y un
  # buscador lo lee como paginas duplicadas. La excepcion es /producto/, que si
  # necesita un unico HTML para todos sus slugs (bloque de arriba).
  location / {
    try_files $uri $uri/ =404;
  }
}
